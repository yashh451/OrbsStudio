<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orb Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08090c; --panel:#0e1116; --raised:#141922; --hover:#1a2029;
  --border:#1e2530; --border-soft:#171d26;
  --text:#dce3ec; --muted:#7a8494; --faint:#4a5261;
  --accent:#64f0d2; --accent-dim:rgba(100,240,210,.12);
  --danger:#ff6b6b;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--disp);font-size:13px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#232b37;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;height:100vh;
  grid-template-rows:46px 1fr 58px;
  grid-template-columns:236px 1fr 264px;
  grid-template-areas:"top top top" "left view right" "left states right";
}

/* ---------- Topbar ---------- */
#topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.02em;font-size:14px}
.brand-dot{width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#b9fff0,var(--accent) 45%,#0b6b58 100%);
  box-shadow:0 0 10px rgba(100,240,210,.7)}
.brand small{color:var(--faint);font-family:var(--mono);font-size:10px;font-weight:400;margin-left:2px}
#topbar .spacer{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:6px;
  border:1px solid var(--border);background:var(--raised);color:var(--muted);
  font-size:12px;font-weight:500;transition:all .15s}
.tbtn:hover{color:var(--text);border-color:#2c3644}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#052620;font-weight:600}
.tbtn.primary:hover{filter:brightness(1.08)}
.tbtn svg{width:13px;height:13px}

/* ---------- Left sidebar ---------- */
#left{grid-area:left;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden}
.side-head{padding:12px 14px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  color:var(--faint);text-transform:uppercase}
#search{margin:0 12px 10px;padding:7px 10px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:12px;width:calc(100% - 24px);outline:none}
#search:focus{border-color:#31527a}
#preset-list{flex:1;overflow-y:auto;padding:0 8px 16px}
.cat{margin-bottom:2px}
.cat-head{display:flex;align-items:center;gap:7px;width:100%;padding:7px 8px;border-radius:6px;
  color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.01em}
.cat-head:hover{color:var(--text)}
.cat-head .chev{margin-left:auto;transition:transform .15s;font-size:9px;color:var(--faint)}
.cat.open .chev{transform:rotate(90deg)}
.cat-items{display:none;padding:2px 0 4px}
.cat.open .cat-items{display:block}
.preset{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px 6px 14px;
  border-radius:6px;color:var(--muted);font-size:12.5px;text-align:left;transition:background .1s}
.preset:hover{background:var(--hover);color:var(--text)}
.preset.active{background:var(--accent-dim);color:var(--accent)}
.swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px var(--sw,transparent)}

/* ---------- Viewport ---------- */
#view{grid-area:view;position:relative;background:
  radial-gradient(1200px 700px at 50% 42%, #0c1017 0%, var(--bg) 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#gl:active{cursor:grabbing}
.hud{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:10px;
  color:var(--faint);display:flex;gap:14px;pointer-events:none}
.hud b{color:var(--muted);font-weight:500}
#preset-name{position:absolute;top:14px;left:16px;pointer-events:none}
#preset-name .nm{font-size:15px;font-weight:600;letter-spacing:.01em}
#preset-name .ct{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.view-tools{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.vbtn{padding:6px 10px;border-radius:6px;border:1px solid var(--border);
  background:rgba(14,17,22,.8);backdrop-filter:blur(6px);color:var(--muted);font-size:11.5px}
.vbtn:hover{color:var(--text)}

/* ---------- State bar ---------- */
#states{grid-area:states;background:var(--panel);border-top:1px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 14px;overflow-x:auto}
#states .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;margin-right:8px;flex-shrink:0}
.state{padding:7px 13px;border-radius:20px;border:1px solid var(--border);color:var(--muted);
  font-size:12px;font-weight:500;white-space:nowrap;transition:all .15s;flex-shrink:0}
.state:hover{color:var(--text);border-color:#2c3644}
.state.active{background:var(--accent-dim);border-color:rgba(100,240,210,.4);color:var(--accent)}

/* ---------- Right inspector ---------- */
#right{grid-area:right;background:var(--panel);border-left:1px solid var(--border);
  overflow-y:auto;padding-bottom:20px}
.insp-sec{border-bottom:1px solid var(--border-soft)}
.insp-head{display:flex;align-items:center;width:100%;padding:11px 14px;
  font-size:12px;font-weight:600;color:var(--text);letter-spacing:.01em}
.insp-head .chev{margin-left:auto;font-size:9px;color:var(--faint);transition:transform .15s}
.insp-sec.open .insp-head .chev{transform:rotate(90deg)}
.insp-body{display:none;padding:2px 14px 14px}
.insp-sec.open .insp-body{display:block}
.ctl{margin-bottom:11px}
.ctl-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.ctl-lbl{font-size:11.5px;color:var(--muted)}
.ctl-val{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
input[type=range]{-webkit-appearance:none;width:100%;height:3px;border-radius:2px;
  background:#232b37;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
  border-radius:50%;background:#cfd8e3;border:2px solid var(--panel);cursor:pointer;
  transition:background .1s}
input[type=range]:hover::-webkit-slider-thumb{background:var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;
  background:#cfd8e3;border:2px solid var(--panel);cursor:pointer}
.color-ctl{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.color-ctl input[type=color]{-webkit-appearance:none;width:38px;height:22px;border:1px solid var(--border);
  border-radius:5px;background:none;cursor:pointer;padding:0}
.color-ctl input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.color-ctl input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
.sel{background:var(--bg);border:1px solid var(--border);color:var(--text);
  border-radius:6px;padding:5px 8px;font-size:12px;font-family:inherit;outline:none;cursor:pointer}
.sel:focus{border-color:#31527a}
.toggle-ctl{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tog{position:relative;width:32px;height:18px;border-radius:10px;background:#232b37;transition:background .15s}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
  background:#8a94a3;transition:all .15s}
.tog.on{background:var(--accent)}
.tog.on::after{left:16px;background:#052620}

/* ---------- mode switch + dot stage ---------- */
.modesw{display:flex;gap:2px;background:var(--raised);border:1px solid var(--border);
  border-radius:7px;padding:2px;margin-left:6px}
.msw{padding:5px 11px;border-radius:5px;font-size:11.5px;font-weight:500;color:var(--muted)}
.msw.active{background:var(--hover);color:var(--text)}
#dotstage{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:26px}
#dotstage.on{display:flex}
#dotmain{width:120px;height:120px}
#sizechips{display:flex;align-items:center;gap:6px;background:rgba(14,17,22,.75);
  border:1px solid var(--border);border-radius:9px;padding:7px 11px;backdrop-filter:blur(6px)}
.sclbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--faint);
  text-transform:uppercase;margin-right:2px}
.schip{padding:4px 9px;border-radius:6px;font-size:11px;color:var(--muted);
  border:1px solid transparent}
.schip:hover{color:var(--text)}
.schip.active{background:var(--accent-dim);border-color:rgba(100,240,210,.35);color:var(--accent)}
#sizerange{width:120px;margin-left:6px}
.sval{font-family:var(--mono);font-size:10px;color:var(--faint);width:38px;text-align:right}
#dotstage.light #sizechips{background:rgba(255,255,255,.8);border-color:#dfe4ea}
#dotstage.light .schip{color:#5a6472}
#dotstage.light .sclbl,#dotstage.light .sval{color:#8a94a3}
#dotsizes{display:flex;align-items:flex-end;gap:26px}
.dsz{display:flex;flex-direction:column;align-items:center;gap:7px}
.dsz span{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
#dotctx .bubble{display:flex;align-items:center;gap:9px;padding:9px 15px 9px 12px;
  border-radius:16px;background:var(--raised);border:1px solid var(--border);
  font-size:12.5px;color:var(--muted)}
#dotstage.light #dotctx .bubble{background:#fff;border-color:#dfe4ea;color:#4a5261}
/* ---------- node editor ---------- */
#nodes-panel{position:fixed;left:236px;right:264px;bottom:58px;height:0;
  background:rgba(10,13,18,.97);border-top:1px solid var(--border);
  backdrop-filter:blur(8px);overflow:hidden;transition:height .22s ease;z-index:40}
#nodes-panel.open{height:min(48vh,420px)}
.np-head{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--border-soft)}
.np-head b{font-size:12px;font-weight:600}
.np-hint{font-family:var(--mono);font-size:10px;color:var(--faint)}
.np-x{margin-left:auto;color:var(--muted);padding:2px 6px}
.np-x:hover{color:var(--text)}
.np-canvas{position:relative;width:100%;height:calc(100% - 38px);overflow:hidden;
  background-image:radial-gradient(circle,#1a212c 1px,transparent 1px);background-size:22px 22px}
#np-wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#np-wires path{pointer-events:stroke;cursor:pointer}
.node{position:absolute;width:132px;background:var(--raised);border:1px solid var(--border);
  border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.45);user-select:none}
.node.off{opacity:.42}
.node .nh{padding:6px 9px;font-size:11px;font-weight:600;border-bottom:1px solid var(--border-soft);
  cursor:grab;display:flex;align-items:center;gap:6px;border-radius:9px 9px 0 0}
.node .nh .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.node.off .nh .dot{background:var(--faint)}
.node .nb{padding:7px 9px 9px}
.node .nrow{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:3px}
.node .nrow span:last-child{font-family:var(--mono);color:var(--faint)}
.node input[type=range]{height:3px;margin-bottom:6px}
.port{position:absolute;width:11px;height:11px;border-radius:50%;background:#222b38;
  border:1.5px solid #3a4756;cursor:crosshair;top:14px}
.port:hover,.port.armed{background:var(--accent);border-color:var(--accent)}
.port.in{left:-6px}.port.out{right:-6px}
/* ---------- toast / misc ---------- */
#toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--raised);border:1px solid var(--border);border-radius:8px;
  padding:9px 15px;font-size:12px;color:var(--text);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.tbtn.on{background:var(--accent-dim);border-color:rgba(100,240,210,.4);color:var(--accent)}
.tbtn:disabled{opacity:.35;cursor:default}
.preset .del{margin-left:auto;color:var(--faint);font-size:12px;padding:0 3px;opacity:0}
.preset:hover .del{opacity:1}
.preset .del:hover{color:var(--danger)}
#level{position:absolute;left:14px;top:14px;width:3px;height:0;background:var(--accent);
  border-radius:2px;transition:height .06s;box-shadow:0 0 8px var(--accent)}
/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:50}
#modal.show{display:flex}
.modal-box{width:min(720px,92vw);max-height:84vh;display:flex;flex-direction:column;
  background:var(--raised);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.modal-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:14px;font-weight:600}
.modal-head .x{margin-left:auto;color:var(--muted);font-size:16px;padding:4px 8px}
.modal-head .x:hover{color:var(--text)}
.tabs{display:flex;gap:4px;padding:10px 18px 0}
.tab{padding:7px 13px;border-radius:7px 7px 0 0;font-size:12px;font-weight:500;color:var(--muted);
  border:1px solid transparent;border-bottom:none}
.tab.active{color:var(--text);background:var(--bg);border-color:var(--border)}
.code-wrap{flex:1;overflow:auto;margin:0 18px 14px;background:var(--bg);
  border:1px solid var(--border);border-radius:0 8px 8px 8px}
.code-wrap pre{padding:14px;font-family:var(--mono);font-size:11px;line-height:1.55;color:#a8b4c4;
  white-space:pre;tab-size:2}
.modal-foot{display:flex;gap:8px;padding:0 18px 16px}
.hint{font-family:var(--mono);font-size:10px;color:var(--faint);padding:8px 18px 4px}

@media (max-width:980px){
  #app{grid-template-columns:200px 1fr 232px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand"><span class="brand-dot"></span>Orb Studio<small>v2.0</small></div>
    <div class="modesw">
      <button class="msw active" data-mode="3d">3D Orb</button>
      <button class="msw" data-mode="dots">Dot Orb</button>
    </div>
    <div class="spacer"></div>
    <button class="tbtn" id="btn-undo" title="Undo (⌘Z)">↶</button>
    <button class="tbtn" id="btn-redo" title="Redo (⇧⌘Z)">↷</button>
    <button class="tbtn" id="btn-mic" title="Audio reactive (M)">🎙 Audio</button>
    <button class="tbtn" id="btn-save" title="Save preset (S)">★ Save</button>
    <button class="tbtn" id="btn-shot" title="Snapshot PNG (P)">Snapshot</button>
    <button class="tbtn" id="btn-rec" title="Record WebM video (V)">● Record</button>
    <button class="tbtn" id="btn-share" title="Copy share link (L)">Share</button>
    <button class="tbtn" id="btn-nodes" title="Node graph (N)">⬡ Nodes</button>
    <button class="tbtn" id="btn-random">⟳ Randomize</button>
    <button class="tbtn" id="btn-reset">Reset</button>
    <button class="tbtn" id="btn-import">Import</button>
    <button class="tbtn primary" id="btn-export">Export code</button>
  </div>

  <div id="left">
    <div class="side-head">Preset Library</div>
    <input id="search" placeholder="Search presets…" spellcheck="false">
    <div id="preset-list"></div>
  </div>

  <div id="view">
    <canvas id="gl"></canvas>
    <div id="level"></div>
    <div id="dotstage">
      <canvas id="dotmain"></canvas>
      <div id="sizechips">
        <span class="sclbl">Size</span>
        <button class="schip" data-s="16">16</button>
        <button class="schip" data-s="20">20</button>
        <button class="schip" data-s="24">24</button>
        <button class="schip" data-s="32">32</button>
        <button class="schip" data-s="48">48</button>
        <button class="schip active" data-s="120">120</button>
        <button class="schip" data-s="200">200</button>
        <input type="range" id="sizerange" min="14" max="260" value="120">
        <span class="sval" id="sizeval">120px</span>
      </div>
      <div id="dotsizes">
        <div class="dsz"><canvas data-size="16"></canvas><span>16</span></div>
        <div class="dsz"><canvas data-size="20"></canvas><span>20</span></div>
        <div class="dsz"><canvas data-size="28"></canvas><span>28</span></div>
        <div class="dsz"><canvas data-size="40"></canvas><span>40</span></div>
        <div class="dsz"><canvas data-size="64"></canvas><span>64</span></div>
      </div>
      <div id="dotctx">
        <div class="bubble"><canvas data-size="18"></canvas><span>Thinking…</span></div>
      </div>
    </div>
    <div id="preset-name"><div class="nm"></div><div class="ct"></div></div>
    <div class="view-tools">
      <button class="vbtn" id="btn-bg">Background</button>
      <button class="vbtn" id="btn-cam">Reset camera</button>
    </div>
    <div class="hud"><span><b id="fps">60</b> fps</span><span><b id="pcount">0</b> particles</span><span>drag to orbit · scroll to zoom · press ? for shortcuts</span></div>
  </div>

  <div id="states">
    <span class="lbl">AI State</span>
  </div>

  <div id="right"></div>
</div>

<div id="nodes-panel">
  <div class="np-head">
    <b>Node Graph</b>
    <span class="np-hint">drag nodes · click port → port to connect · click a wire to cut</span>
    <button class="np-x" id="nodes-close">✕</button>
  </div>
  <div class="np-canvas" id="np-canvas">
    <svg id="np-wires"></svg>
  </div>
</div>
<div id="toast"></div>
<div id="modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modal-title">Export</h3><button class="x" id="modal-close">✕</button></div>
    <div class="tabs" id="modal-tabs"></div>
    <div class="hint" id="modal-hint"></div>
    <div class="code-wrap"><pre id="modal-code"></pre></div>
    <div class="modal-foot">
      <button class="tbtn primary" id="btn-copy">Copy to clipboard</button>
      <button class="tbtn" id="btn-dl">Download file</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   ORB STUDIO — parametric orb engine
   ============================================================ */

const NOISE_GLSL = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));

  vec3 col=mix(uBgA,uBgB,smoothstep(0.0,0.75,r));
  if(uBgStars>0.01){

const ORB_VERT = NOISE_GLSL + `
uniform float uTime,uDistortion,uNoiseScale,uFlowSpeed,uPulse,uScale;
varying vec3 vNormal,vPos;varying float vNoise;
void main(){
  float t=uTime*uFlowSpeed;
  float n=snoise(position*uNoiseScale+vec3(t*0.7,t*0.5,t*0.3));
  float n2=snoise(position*uNoiseScale*2.4+vec3(-t*0.4,t*0.6,t*0.2))*0.4;
  vNoise=n+n2;
  vec3 p=position+normal*(vNoise*uDistortion);
  p*=uScale*(1.0+uPulse);
  vNormal=normalize(normalMatrix*normal);
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  vPos=mv.xyz;
  gl_Position=projectionMatrix*mv;
}`;

const ORB_FRAG = NOISE_GLSL + `
uniform float uTime,uFresnelPow,uGlowIntensity,uOpacity,uMetal,uFlowSpeed,uNoiseScale;
uniform float uRefract,uDispersion,uBgOn;
uniform vec2 uRes;
uniform sampler2D tBG;
uniform vec3 uColorA,uColorB,uGlowColor;
varying vec3 vNormal,vPos;varying float vNoise;
void main(){
  vec3 N=normalize(vNormal);
  vec3 V=normalize(-vPos);
  float fres=pow(1.0-abs(dot(N,V)),uFresnelPow);
  float band=0.5+0.5*sin(vNoise*3.0+uTime*uFlowSpeed*1.5);
  vec3 base=mix(uColorA,uColorB,clamp(band*0.7+N.y*0.35+0.15,0.0,1.0));
  /* fake key light for metallic/matte shading */
  vec3 L=normalize(vec3(0.6,0.8,0.5));
  float diff=max(dot(N,L),0.0);
  vec3 H=normalize(L+V);
  float spec=pow(max(dot(N,H),0.0),mix(8.0,90.0,uMetal))*uMetal;
  vec3 col=base*(0.35+diff*0.75)+vec3(spec)*1.2;
  float alpha=clamp(uOpacity+fres*0.55,0.0,1.0);
  /* screen-space refraction: bend the backdrop through the surface,
     with chromatic dispersion (R/G/B bent by slightly different amounts) */
  if(uRefract>0.001&&uBgOn>0.5){
    vec2 suv=gl_FragCoord.xy/uRes;
    vec3 rdir=refract(-V,N,0.72);
    vec2 off=rdir.xy*uRefract*0.22;
    float dsp=uDispersion*0.35;
    vec3 rc;
    rc.r=texture2D(tBG,clamp(suv+off*(1.0+dsp),0.001,0.999)).r;
    rc.g=texture2D(tBG,clamp(suv+off,0.001,0.999)).g;
    rc.b=texture2D(tBG,clamp(suv+off*(1.0-dsp),0.001,0.999)).b;
    /* thin surfaces transmit more; rims stay reflective */
    float trans=(1.0-alpha)*(1.0-fres*0.7);
    col=mix(col,col*0.45+rc*1.15,clamp(trans*1.6,0.0,1.0));
    alpha=clamp(alpha+dot(rc,vec3(.33))*trans*0.9,0.0,1.0);
  }
  col+=uGlowColor*fres*uGlowIntensity;
  gl_FragColor=vec4(col,alpha);
}`;

const FLOW_GLSL = NOISE_GLSL + `
uniform float uTime,uPSpeed,uPSize,uSpread,uFlat,uScale,uTrail;
vec3 flowPos(float t,float aSeed,float aSeed2,float aRadius,out float heat){
  float th=aSeed*6.28318 + t*(0.22+aSeed2*0.45);
  float cph=2.0*fract(aSeed2*7.31)-1.0;
  th  += snoise(vec3(aSeed*57.1, t*0.16, 1.7))*1.5;
  cph += snoise(vec3(t*0.11, aSeed*31.7, 4.2))*0.4;
  cph=clamp(cph,-0.999,0.999);
  float ph=acos(cph);
  float r=(1.05 + aRadius*uSpread + 0.05*sin(t*0.6+aSeed*40.0))*uScale;
  vec3 p=vec3(cos(th)*sin(ph),cos(ph),sin(th)*sin(ph))*r;
  p.y*=(1.0-uFlat*0.94);
  heat=1.0-clamp((r/uScale-1.05)/(uSpread+0.06),0.0,1.0);
  return p;
}
float lifeAt(float t,float aSeed,float aSeed2){
  float life=fract(aSeed*13.73 + t*0.11*(0.4+aSeed2));
  return smoothstep(0.0,0.18,life)*smoothstep(1.0,0.72,life);
}
float orbOcclusion(vec4 mv,mat4 mvMat){
  vec4 cs=mvMat*vec4(0.0,0.0,0.0,1.0);
  float R=uScale;
  float d2=length(mv.xy-cs.xy);
  float behind=step(mv.z,cs.z);
  return 1.0-behind*(1.0-smoothstep(R*0.82,R*1.06,d2))*0.93;
}`;

const PART_VERT = FLOW_GLSL + `
attribute float aSeed,aSeed2,aRadius,aSize;
varying float vAlpha,vHeat;
void main(){
  float t=uTime*uPSpeed;
  float lifeFade=lifeAt(t,aSeed,aSeed2);
  float heat;
  vec3 p=flowPos(t,aSeed,aSeed2,aRadius,heat);
  vHeat=heat;
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  vAlpha=lifeFade*orbOcclusion(mv,modelViewMatrix);
  float sz=aSize*uPSize*(0.55+0.55*heat)*(62.0/-mv.z);
  gl_PointSize=clamp(sz,1.0,44.0);
  gl_Position=projectionMatrix*mv;
}`;

const PART_FRAG = `
uniform vec3 uPColor,uPColor2;
varying float vAlpha,vHeat;
void main(){
  float d=length(gl_PointCoord-0.5)*2.0;
  float glow=exp(-d*d*4.0);
  float core=exp(-d*d*26.0);
  float a=(glow*0.5+core*0.95)*vAlpha;
  if(a<0.008)discard;
  vec3 col=mix(uPColor,uPColor2,vHeat*0.65)*(0.75+vHeat*0.65);
  gl_FragColor=vec4(col,a);
}`;

/* trails: each particle gets a head+tail line segment; the tail vertex
   evaluates the same flow field a moment in the past */
const TRAIL_VERT = FLOW_GLSL + `
attribute float aSeed,aSeed2,aRadius,aTail;
varying float vAlpha,vHeat;
void main(){
  float t=uTime*uPSpeed;
  float lifeFade=lifeAt(t,aSeed,aSeed2);
  float heat;
  vec3 p=flowPos(t-aTail*(0.05+uTrail*0.22),aSeed,aSeed2,aRadius,heat);
  vHeat=heat;
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  vAlpha=lifeFade*orbOcclusion(mv,modelViewMatrix)*(1.0-aTail*0.9)*clamp(uTrail*2.0,0.0,1.0);
  gl_Position=projectionMatrix*mv;
}`;

function rebuildParticles(){
  if(points){scene.remove(points);points.geometry.dispose();}
  const n=params.pEnabled?Math.round(params.pCount):0;
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(n*3);
  const seed=new Float32Array(n),seed2=new Float32Array(n),rad=new Float32Array(n),siz=new Float32Array(n);
  for(let i=0;i<n;i++){seed[i]=Math.random();seed2[i]=Math.random();
    rad[i]=Math.pow(Math.random(),1.4);
    siz[i]=.4+Math.pow(Math.random(),3)*2.1;}      /* mostly fine dust, a few bright motes */
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  geo.setAttribute('aSeed2',new THREE.BufferAttribute(seed2,1));
  geo.setAttribute('aRadius',new THREE.BufferAttribute(rad,1));
  geo.setAttribute('aSize',new THREE.BufferAttribute(siz,1));
  points=new THREE.Points(geo,pMat);
  scene.add(points);
  if(trails){scene.remove(trails);trails.geometry.dispose();}
  const tg=new THREE.BufferGeometry();
  const tp=new Float32Array(n*6),ts=new Float32Array(n*2),ts2=new Float32Array(n*2),
        tr=new Float32Array(n*2),tt=new Float32Array(n*2);
  for(let i=0;i<n;i++){
    ts[2*i]=seed[i];ts[2*i+1]=seed[i];
    ts2[2*i]=seed2[i];ts2[2*i+1]=seed2[i];
    tr[2*i]=rad[i];tr[2*i+1]=rad[i];
    tt[2*i]=0;tt[2*i+1]=1;
  }
  tg.setAttribute('position',new THREE.BufferAttribute(tp,3));
  tg.setAttribute('aSeed',new THREE.BufferAttribute(ts,1));
  tg.setAttribute('aSeed2',new THREE.BufferAttribute(ts2,1));
  tg.setAttribute('aRadius',new THREE.BufferAttribute(tr,1));
  tg.setAttribute('aTail',new THREE.BufferAttribute(tt,1));
  trails=new THREE.LineSegments(tg,trailMat);
  scene.add(trails);
  document.getElementById('pcount').textContent=n;
}

/* audio reactivity */
let audioOn=false,analyser=null,audioData=null,audioLevel=0,audioBass=0,micStream=null;
async function toggleAudio(){
  if(audioOn){
    audioOn=false;
    if(micStream)micStream.getTracks().forEach(t=>t.stop());
    micStream=null;analyser=null;audioLevel=0;audioBass=0;
    $('#btn-mic').classList.remove('on');$('#level').style.height='0px';
    toast('Audio reactivity off');return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const srcNode=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=.75;
    srcNode.connect(analyser);
    audioData=new Uint8Array(analyser.frequencyBinCount);
    micStream=stream;audioOn=true;
    $('#btn-mic').classList.add('on');
    toast('Audio reactive — orb responds to your mic');
  }catch(e){ toast('Microphone unavailable or permission denied'); }
}
function sampleAudio(){
  if(!audioOn||!analyser)return;
  analyser.getByteFrequencyData(audioData);
  let bass=0,all=0;
  const nb=Math.max(1,Math.floor(audioData.length*0.12));
  for(let i=0;i<nb;i++)bass+=audioData[i];
  for(let i=0;i<audioData.length;i++)all+=audioData[i];
  const b=bass/nb/255, a=all/audioData.length/255;
  audioBass+=(b-audioBass)*.35;
  audioLevel+=(a-audioLevel)*.25;
  $('#level').style.height=(audioLevel*120).toFixed(0)+'px';
}

const POST_VERT=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;
const BRIGHT_FRAG=`uniform sampler2D tDiffuse;uniform float uThreshold;varying vec2 vUv;

const BLUR_FRAG=`uniform sampler2D tDiffuse;uniform vec2 uDir;varying vec2 vUv;
void main(){vec3 s=vec3(0.);
s+=texture2D(tDiffuse,vUv-uDir*4.).rgb*.051;
s+=texture2D(tDiffuse,vUv-uDir*3.).rgb*.0918;
s+=texture2D(tDiffuse,vUv-uDir*2.).rgb*.1231;
s+=texture2D(tDiffuse,vUv-uDir*1.).rgb*.1531;
s+=texture2D(tDiffuse,vUv).rgb*.1633;
s+=texture2D(tDiffuse,vUv+uDir*1.).rgb*.1531;
s+=texture2D(tDiffuse,vUv+uDir*2.).rgb*.1231;
s+=texture2D(tDiffuse,vUv+uDir*3.).rgb*.0918;
s+=texture2D(tDiffuse,vUv+uDir*4.).rgb*.051;
gl_FragColor=vec4(s,1.);}`;
const COMP_FRAG=`
uniform sampler2D tScene,tBloomA,tBloomB,tBG2;
uniform float uStrength,uStyle,uStyleAmt,uStyleScale,uTone,uBgOn2;
uniform vec2 uRes;
uniform vec3 uToneA,uToneB;
varying vec2 vUv;
/* ordered Bayer dithering, array-free (WebGL1-safe) */
float bayer2(vec2 a){a=floor(a);return fract(a.x/2.+a.y*a.y*.75);}
float bayer4(vec2 a){return bayer2(.5*a)*.25+bayer2(a);}
float bayer8(vec2 a){return bayer4(.5*a)*.25+bayer2(a);}
void main(){
  vec2 suv=vUv;
  /* pixel mode: quantize sample position first */
  if(uStyle>3.5&&uStyle<4.5){
    float cov=texture2D(tScene,vUv).a;
    if(cov>.01){
      float px=6.*uStyleScale;
      suv=(floor(vUv*uRes/px)+.5)*px/uRes;
    }
  }
  vec4 base=texture2D(tScene,suv);
  vec3 bl=(texture2D(tBloomA,suv).rgb+texture2D(tBloomB,suv).rgb*1.25)*uStrength;
  bl=bl/(1.+bl*.35);
  vec3 col=base.rgb+bl;
  float bloomLum=dot(bl,vec3(.299,.587,.114));
  float a=clamp(base.a+bloomLum,0.,1.);
  /* coverage mask: style applies ONLY where the orb + its glow exist,
     never to the empty background */
  float mask=smoothstep(.02,.12,base.a+bloomLum);
  vec3 styled=col;
  float aS=a;
  float lum=dot(col,vec3(.2126,.7152,.0722));
  if(uStyle>.5&&uStyle<1.5){
    /* DITHER: Bayer-8 threshold */
    float b=bayer8(vUv*uRes/(1.5*uStyleScale));
    float q=step(b,lum*1.15);
    styled=(uTone>.5)?mix(uToneB,uToneA,q)
                     :mix(vec3(0.),normalize(col+.0001)*1.5,q); /* hue-keeping dots */
    aS=(uTone>.5)?q*.92:a*max(q,.12);
  }else if(uStyle>1.5&&uStyle<2.5){

    vec3 bg=texture2D(tBG2,vUv).rgb;

let simTime=0,last=performance.now(),fpsAcc=0,fpsN=0,fpsT=0;
const cA=new THREE.Color(),cB=new THREE.Color(),cG=new THREE.Color(),cP=new THREE.Color();
function frame(now){
  requestAnimationFrame(frame);
  if(typeof now!=='number'||!isFinite(now))return;
  let dt=(now-last)/1000; if(!isFinite(dt))dt=0;
  dt=Math.max(0,Math.min(dt,.05));last=now; /* clamp: no NaN on clock skew */
  const S=STATES[currentState],k=1-Math.pow(.001,dt);
  mods.time=lerp(mods.time,S.time,k);
  mods.pulseAmp=lerp(mods.pulseAmp,S.pulseAmp,k);
  mods.pulseSpeed=lerp(mods.pulseSpeed,S.pulseSpeed,k);
  mods.pSpeed=lerp(mods.pSpeed,S.pSpeed,k);
  mods.glow=lerp(mods.glow,S.glow,k);
  const tgtAmt=S.tint?S.tintAmt:0;
  mods.tintAmt=lerp(mods.tintAmt,tgtAmt,k);
  if(S.tint)mods.tint.lerp(new THREE.Color(S.tint),k);

  simTime+=dt*mods.time;
  uniforms.uTime.value=simTime;
  pUniforms.uTime.value=simTime;

  cA.set(params.colorA).lerp(mods.tint,mods.tintAmt);
  cB.set(params.colorB).lerp(mods.tint,mods.tintAmt);
  cG.set(params.glowColor).lerp(mods.tint,mods.tintAmt);
  cP.set(params.pColor).lerp(mods.tint,mods.tintAmt);
  uniforms.uColorA.value.copy(cA);uniforms.uColorB.value.copy(cB);uniforms.uGlowColor.value.copy(cG);
  pUniforms.uPColor.value.copy(cP);pUniforms.uPColor2.value.copy(cG);

  uniforms.uDistortion.value=params.distortion;
  uniforms.uNoiseScale.value=params.noiseScale;
  uniforms.uFlowSpeed.value=params.flowSpeed;
  uniforms.uScale.value=params.scale;
  uniforms.uFresnelPow.value=params.fresnelPow;
  uniforms.uGlowIntensity.value=params.glowIntensity*mods.glow;
  uniforms.uOpacity.value=params.opacity;
  uniforms.uMetal.value=params.metal;
  /* node-graph gates: applied for this frame only, then restored,
     so cutting a wire never destroys the user's slider values */
  const gateSaved={};
  for(const k in gateOverrides){gateSaved[k]=params[k];params[k]=gateOverrides[k];}
  sampleAudio();
  const aBoost=audioOn?1+audioLevel*1.9:1, aPulse=audioOn?audioBass*.26:0;
  uniforms.uPulse.value=Math.sin(simTime*params.pulseSpeed*mods.pulseSpeed)*params.pulseAmp*mods.pulseAmp+aPulse;
  uniforms.uGlowIntensity.value=params.glowIntensity*mods.glow*aBoost;
  uniforms.uDistortion.value=params.distortion*(audioOn?1+audioLevel*.9:1);
  orbMat.wireframe=params.wireframe;

  pUniforms.uPSpeed.value=params.pSpeed*mods.pSpeed*(audioOn?1+audioLevel*1.4:1);
  pUniforms.uPSize.value=params.pSize;
  pUniforms.uSpread.value=params.pSpread;
  pUniforms.uFlat.value=params.pFlat;
  pUniforms.uScale.value=params.scale;
  pUniforms.uTrail.value=params.pTrail;
  if(trails){trails.visible=params.pEnabled&&params.pTrail>0.02;
    trails.rotation.y=orb.rotation.y*.3;}

  haloMat.color.copy(cG);halo2Mat.color.copy(cG);
  const hb=params.halo*mods.glow;
  haloMat.opacity=Math.min(.7,.16*hb+uniforms.uPulse.value*.25);
  halo2Mat.opacity=Math.min(.75,.22*hb+uniforms.uPulse.value*.3);
  halo.scale.setScalar(3.6*params.scale*Math.max(.3,hb)*(1+uniforms.uPulse.value*.6));
  halo2.scale.setScalar(2.25*params.scale*(1+uniforms.uPulse.value));

  orb.rotation.y+=dt*params.rotSpeed*mods.time;
  if(points){points.rotation.y=orb.rotation.y*.3;points.visible=params.pEnabled;}

  rotX=lerp(rotX,tRotX,k);rotY=lerp(rotY,tRotY,k);dist=lerp(dist,tDist,k);
  camera.position.set(Math.sin(rotY)*Math.cos(rotX)*dist,Math.sin(rotX)*dist,Math.cos(rotY)*Math.cos(rotX)*dist);
  camera.lookAt(0,0,0);

  renderFrame();
  for(const k in gateSaved)params[k]=gateSaved[k];
  fpsAcc+=dt;fpsN++;fpsT+=dt;
  if(fpsT>.5){document.getElementById('fps').textContent=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0;fpsT=0;}
}

/* ---- history ---- */
const history={past:[],future:[]};
let histTimer=null;
function snapshot(){
  const s=JSON.stringify(params);
  if(history.past[history.past.length-1]===s)return;
  history.past.push(s);
  if(history.past.length>60)history.past.shift();
  history.future.length=0;
  updateHistBtns();
}
function pushDebounced(){clearTimeout(histTimer);histTimer=setTimeout(snapshot,420);}
function updateHistBtns(){
  $('#btn-undo').disabled=history.past.length<2;
  $('#btn-redo').disabled=history.future.length===0;
}
function restore(json){
  const cfg=JSON.parse(json);
  const geo=params.lowPoly!==cfg.lowPoly;
  const par=params.pCount!==cfg.pCount||params.pEnabled!==cfg.pEnabled;
  params=cfg;
  if(geo)rebuildGeo();
  if(par)rebuildParticles();
  renderInspector();
}
function undo(){
  if(history.past.length<2)return;
  history.future.push(history.past.pop());
  restore(history.past[history.past.length-1]);
  updateHistBtns();toast('Undo');
}
function redo(){
  if(!history.future.length)return;
  const s=history.future.pop();
  history.past.push(s);restore(s);
  updateHistBtns();toast('Redo');
}

/* ---- video recording ---- */
let recorder=null,recChunks=[],recTimer=null;
function toggleRecord(){
  if(recorder){ recorder.stop(); return; }
  if(!canvas.captureStream||typeof MediaRecorder==='undefined'){
    toast('Recording unsupported in this browser'); return;
  }
  const mimes=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=mimes.find(m=>MediaRecorder.isTypeSupported(m));
  if(!mime){toast('No supported video encoder found');return;}
  try{
    const stream=canvas.captureStream(60);
    recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000});
  }catch(e){ toast('Could not start recorder'); recorder=null; return; }
  recChunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
  recorder.onstop=()=>{
    clearInterval(recTimer);
    const blob=new Blob(recChunks,{type:'video/webm'});
    const a2=document.createElement('a');
    a2.href=URL.createObjectURL(blob);
    a2.download=currentPreset.name.toLowerCase().replace(/\s+/g,'-')+'.webm';
    a2.click();URL.revokeObjectURL(a2.href);
    recorder=null;
    $('#btn-rec').classList.remove('on');
    $('#btn-rec').textContent='● Record';
    toast('Video saved as WebM ('+(blob.size/1048576).toFixed(1)+' MB)');
  };
  recorder.start();
  let secs=0;
  $('#btn-rec').classList.add('on');
  recTimer=setInterval(()=>{
    secs++;$('#btn-rec').textContent='■ Stop '+secs+'s';
    if(secs>=60&&recorder)recorder.stop();   /* safety cap */
  },1000);
  toast('Recording — click Stop to save (60s max)');
}

/* ============================================================
   Node graph — a real dataflow editor. Each node owns parameters and
   only contributes when a path of wires reaches the Output node.
   Cutting a wire genuinely disables that stage of the orb.
   ============================================================ */
const NODE_DEFS={
  noise:  {t:'Noise',      x:20, y:24, out:true, in:false,
           p:[['noiseScale','Scale',.3,6,.05],['flowSpeed','Speed',0,3,.01]]},
  distort:{t:'Distortion', x:190,y:24, out:true, in:true,
           p:[['distortion','Amount',0,1.2,.01]], gate:{distortion:0}},
  pulse:  {t:'Pulse',      x:190,y:150,out:true, in:true,
           p:[['pulseSpeed','Speed',0,6,.05],['pulseAmp','Amount',0,.35,.005]],
           gate:{pulseAmp:0}},
  parts:  {t:'Particles',  x:360,y:24, out:true, in:true,
           p:[['pCount','Count',0,4000,10],['pSpeed','Speed',0,3,.01]],
           gate:{pEnabled:false}},
  trails: {t:'Trails',     x:360,y:150,out:true, in:true,
           p:[['pTrail','Length',0,1,.01]], gate:{pTrail:0}},
  glow:   {t:'Glow',       x:530,y:24, out:true, in:true,
           p:[['glowIntensity','Intensity',0,3,.01],['bloom','Bloom',0,2,.01]],
           gate:{glowIntensity:.05,bloom:0}},
  style:  {t:'Design Style',x:530,y:150,out:true,in:true,
           p:[['styleAmt','Amount',0,1,.01],['styleScale','Scale',.5,4,.05]],
           gate:{styleAmt:0}},
  out:    {t:'Output',     x:700,y:88, out:false,in:true, p:[]},
};
const nodeState={};                    /* id -> {x,y,el} */
let wires=[
  ['noise','distort'],['noise','pulse'],['distort','parts'],['distort','glow'],
  ['pulse','trails'],['parts','glow'],['trails','style'],['glow','out'],['style','out'],
];
let armedPort=null, nodesReady=false;

function nodeActive(id){                /* DFS: does a path reach Output? */
  if(id==='out')return true;
  const seen=new Set();
  const walk=n=>{
    if(n==='out')return true;
    if(seen.has(n))return false;
    seen.add(n);
    return wires.some(([a,b])=>a===n&&walk(b));
  };
  return walk(id);
}

function buildNodes(){
  const cv=$('#np-canvas');
  Object.entries(NODE_DEFS).forEach(([id,d])=>{
    const el=document.createElement('div');
    el.className='node';el.style.left=d.x+'px';el.style.top=d.y+'px';
    el.innerHTML=`<div class="nh"><span class="dot"></span>${d.t}</div><div class="nb"></div>`;
    const body=el.querySelector('.nb');
    if(!d.p.length)body.innerHTML='<div class="nrow"><span>final orb</span></div>';
    d.p.forEach(([k,label,mn,mx,st])=>{
      const row=document.createElement('div');
      row.innerHTML=`<div class="nrow"><span>${label}</span><span class="v">${fmt(params[k])}</span></div>`;
      const r=document.createElement('input');
      r.type='range';r.min=mn;r.max=mx;r.step=st;r.value=params[k];
      r.dataset.key=k;
      r.addEventListener('input',()=>{
        params[k]=+r.value;
        row.querySelector('.v').textContent=fmt(params[k]);
        if(k==='pCount')rebuildParticles();
        renderInspector();pushDebounced();
      });
      body.appendChild(row);body.appendChild(r);
    });
    if(d.in){const p=document.createElement('div');p.className='port in';p.dataset.id=id;p.dataset.dir='in';el.appendChild(p);}
    if(d.out){const p=document.createElement('div');p.className='port out';p.dataset.id=id;p.dataset.dir='out';el.appendChild(p);}
    cv.appendChild(el);
    nodeState[id]={x:d.x,y:d.y,el};
    /* drag */
    const head=el.querySelector('.nh');
    head.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY,ox=nodeState[id].x,oy=nodeState[id].y;
      const mv=ev=>{
        nodeState[id].x=Math.max(0,ox+ev.clientX-sx);
        nodeState[id].y=Math.max(0,oy+ev.clientY-sy);
        el.style.left=nodeState[id].x+'px';el.style.top=nodeState[id].y+'px';
        drawWires();
      };
      const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};
      addEventListener('pointermove',mv);addEventListener('pointerup',up);
    });
  });
  /* port connect */
  cv.addEventListener('click',e=>{
    const p=e.target.closest('.port');
    if(!p)return;
    if(!armedPort){
      armedPort={id:p.dataset.id,dir:p.dataset.dir,el:p};
      p.classList.add('armed');return;
    }
    const from=armedPort.dir==='out'?armedPort.id:p.dataset.id;
    const to  =armedPort.dir==='out'?p.dataset.id:armedPort.id;
    armedPort.el.classList.remove('armed');
    if(armedPort.dir!==p.dataset.dir && from!==to &&
       !wires.some(([a,b])=>a===from&&b===to)){
      wires.push([from,to]);
      applyGraph();toast('Connected '+NODE_DEFS[from].t+' → '+NODE_DEFS[to].t);
    }
    armedPort=null;
  });
}

function drawWires(){
  const svg=$('#np-wires');
  svg.innerHTML='';
  wires.forEach(([a,b],i)=>{
    const A=nodeState[a],B=nodeState[b];
    if(!A||!B)return;
    const x1=A.x+132,y1=A.y+20,x2=B.x,y2=B.y+20;
    const dx=Math.max(30,Math.abs(x2-x1)*.5);
    const live=nodeActive(a);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);
    path.setAttribute('fill','none');
    path.setAttribute('stroke',live?'#64f0d2':'#39424f');
    path.setAttribute('stroke-width','2');
    path.setAttribute('opacity',live?'.85':'.5');
    path.addEventListener('click',ev=>{
      ev.stopPropagation();
      wires.splice(i,1);applyGraph();
      toast('Cut '+NODE_DEFS[a].t+' → '+NODE_DEFS[b].t);
    });
    svg.appendChild(path);
  });
}

/* gates: params forced to neutral while a node is disconnected */
let gateOverrides={};
function applyGraph(){
  gateOverrides={};
  Object.entries(NODE_DEFS).forEach(([id,d])=>{
    const on=nodeActive(id);
    if(nodeState[id])nodeState[id].el.classList.toggle('off',!on);
    if(!on&&d.gate)Object.assign(gateOverrides,d.gate);
  });
  drawWires();
}

function openNodes(){
  const p=$('#nodes-panel');
  const willOpen=!p.classList.contains('open');
  p.classList.toggle('open',willOpen);
  $('#btn-nodes').classList.toggle('on',willOpen);
  if(willOpen&&!nodesReady){buildNodes();nodesReady=true;}
  if(willOpen){applyGraph();}
}

/* ============================================================
   DOT ORB — dependency-free 2D dotted thought-orb for AI/agent UIs.
   A grid of dots inside a circular field; each state is a hand-tuned
   field function driving per-dot scale + opacity. Renders crisply at
   18px and 220px, and exports as a component with zero dependencies.
   ============================================================ */
const DOT_FIELD = `
function dotField(state,nx,ny,r,ang,t,soft,flatEdge){
  var v=0, edge=flatEdge?1-smooth(0.62,1.0,r):1.0;
  switch(state){
    case 'idle':
      v=edge*(0.55+0.45*Math.sin(t*1.1-r*2.2));
      break;
    case 'listening':                     /* concentric intake ripples */
      v=edge*(0.42+0.58*Math.sin(r*7.5-t*3.4));
      break;
    case 'thinking':                      /* slow double-arm swirl */
      v=edge*(0.4+0.6*Math.sin(ang*2+t*2.1-r*4.4));
      break;
    case 'searching':                     /* sweeping radar beam */
      var d=Math.abs(wrapPi(ang-t*2.6));
      v=edge*(0.18+0.9*Math.exp(-d*d*2.4)*(0.55+0.45*r));
      break;
    case 'processing':                    /* orbiting comet */
      var pa=Math.abs(wrapPi(ang-t*3.4)), rr=Math.abs(r-0.62);
      v=edge*(0.16+1.05*Math.exp(-pa*pa*1.6-rr*rr*26.0));
      break;
    case 'speaking':                      /* vertical waveform bands */
      v=edge*(0.3+0.72*Math.abs(Math.sin(nx*3.1+t*3.0))*(1.0-Math.abs(ny)*0.55));
      break;
    case 'success':                       /* bloom outward, settle full */
      var w=(t*1.5)%3.0;
      v=edge*(w<1.4?smooth(w-0.35,w,r)*1.1:1.0);
      break;
    case 'error':                         /* double-flash + jitter */
      var f=(t*2.2)%2.0;
      v=edge*(f<0.22||(f>0.42&&f<0.64)?1.0:0.34);
      break;
    case 'sleeping':                      /* long shallow breath */
      v=edge*(0.14+0.3*Math.sin(t*0.55-r*1.4));
      break;
    default:                              /* loading: rotating dashes */
      v=edge*(0.22+0.85*Math.pow(Math.max(0,Math.sin(ang*3-t*3.2)),3.0));
  }
  return clamp(v*soft,0,1);
}
function smooth(a,b,x){var u=clamp((x-a)/(b-a||1e-4),0,1);return u*u*(3-2*u);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function wrapPi(a){while(a>Math.PI)a-=6.28318530718;while(a<-Math.PI)a+=6.28318530718;return a;}
/* Latitude-ring lattice: dots sit on rings of constant latitude with even
   angular spacing, which is what makes meridian sweeps, band scrambles and
   waveforms-through-rings readable. Each entry: [lat, lon, ringIndex, seed]. */
var _latCache={};
function latticePoints(rings,density){
  var key=rings+'x'+density;
  if(_latCache[key])return _latCache[key];
  var pts=[];
  for(var i=0;i<rings;i++){
    var lat=-Math.PI/2+Math.PI*(i+0.5)/rings;
    var cr=Math.cos(lat);
    var n=Math.max(1,Math.round(density*cr));
    for(var j=0;j<n;j++){
      var lon=2*Math.PI*j/n+((i%2)?Math.PI/n:0);
      pts.push([lat,lon,i,((i*17+j*7)*0.6180339887)%1,j,n]);
    }
  }
  return _latCache[key]=pts;
}
/* dot radius grows sub-linearly with orb size (power ~0.6), so a 20px orb
   keeps chunky readable dots while a 180px orb stays fine-grained */
function radiusScale(size,pow){return Math.pow(size/64,pow===undefined?0.6:pow);}
function wrapAng(a){while(a>Math.PI)a-=6.28318530718;while(a<-Math.PI)a+=6.28318530718;return a;}

/* ---- the six lattice behaviours ---- */
function latticeState(state,p,t,o){
  /* returns {dlon, dlat, rr, v} : longitude/latitude offsets, radial scale, brightness */
  var lat=p[0], lon=p[1], ring=p[2], sd=p[3];
  var dlon=0, dlat=0, rr=1, v=0.55;
  switch(state){
    case 'working':            /* particles riding tilted orbits */
      var orbit=(ring%3);
      dlon=t*(0.5+orbit*0.25);
      dlat=Math.sin(t*0.8+orbit*2.1)*0.10;
      v=0.30+0.70*Math.pow(Math.max(0,Math.sin(lon+dlon+orbit*2.0)),2.0);
      break;
    case 'searching':          /* a scan meridian sweeps the globe */
      var sweep=wrapAng(lon-t*1.5);
      v=0.16+0.95*Math.exp(-sweep*sweep*3.2);
      rr=1+0.05*Math.exp(-sweep*sweep*3.2);
      break;
    case 'solving':            /* bands scramble, then click back solved */
      var cyc=(t*0.45)%1, step=Math.floor(t*0.45);
      var ease=cyc<0.62?(1-Math.pow(1-cyc/0.62,3)):1;
      var target=(((ring*37+step*53)%7)-3)*(Math.PI/6);
      var prev=(((ring*37+(step-1)*53)%7)-3)*(Math.PI/6);
      dlon=prev+(target-prev)*ease;
      v=0.42+0.5*(cyc>0.62?1:ease*0.7);
      break;
    case 'listening':          /* a waveform rolls through the rings */
      var w=Math.sin(lat*3.0-t*2.2);
      rr=1+w*0.11;
      v=0.28+0.72*(0.5+0.5*w);
      break;
    case 'composing':          /* undulating multi-band sash */
      var sash=lat-Math.sin(lon*2.0+t*1.3)*0.42;
      var band=Math.abs(wrapAng(sash*2.4));
      v=0.14+0.95*Math.exp(-band*band*2.6);
      rr=1+0.04*Math.exp(-band*band*2.6);
      break;
    case 'shaping':            /* handled as an outline morph in the draw fn */
      v=0.6;
      break;
    default:
      return null;             /* fall through to the AI-state field */
  }
  return {dlon:dlon,dlat:dlat,rr:rr,v:v*o};
}
var LATTICE_STATES=['working','searching','solving','listening','composing','shaping'];
/* unit-radius outline sampler: 0 sides = circle, else regular polygon */
function polyPoint(sides,u){
  if(!sides){var a=u*6.28318530718;return [Math.cos(a),Math.sin(a)];}
  var seg=u*sides, k=Math.floor(seg), f=seg-k;
  var a1=(k/sides)*6.28318530718-Math.PI/2, a2=((k+1)/sides)*6.28318530718-Math.PI/2;
  var x1=Math.cos(a1),y1=Math.sin(a1),x2=Math.cos(a2),y2=Math.sin(a2);
  return [x1+(x2-x1)*f, y1+(y2-y1)*f];
}
function paintDot(g,x,y,rad,a,v,base,tint,cfg,light){
  if(rad<=0)return;

  var rgb=Math.round(c3[0])+','+Math.round(c3[1])+','+Math.round(c3[2]);

    g.shadowColor='rgba('+rgb+','+(a*0.8).toFixed(3)+')';
  }else g.shadowBlur=0;
  g.fillStyle='rgba('+rgb+','+Math.min(1,a).toFixed(3)+')';
  g.beginPath();g.arc(x,y,rad,0,6.2832);g.fill();
}

  ['Calm',{...DOT_DEFAULTS,spin:.09,drift:.12,speed:.7,shimmer:.4,flicker:.25}],
  ['Restless',{...DOT_DEFAULTS,spin:.34,drift:.7,speed:1.4,shimmer:2,glow:.5,flicker:.7}],
  ['Mint Agent',{...DOT_DEFAULTS,useAccent:true,accent:'#64f0d2',dotColor:'#93a8a3',glow:.6}],
  ['Violet Agent',{...DOT_DEFAULTS,useAccent:true,accent:'#a78bfa',dotColor:'#9a97ad',glow:.65}],
  ['Amber Agent',{...DOT_DEFAULTS,useAccent:true,accent:'#fbbf24',dotColor:'#ab9f86',glow:.55}],
  ['Light Mode',{...DOT_DEFAULTS,theme:'light',dotColor:'#0b0d12',glow:0,minAlpha:.12}],
  ['Flat Grid',{...DOT_DEFAULTS,structure:'grid',cols:13,dotScale:.7}],
 ]},
];

/* state accent hues used when "Accent by state" is on */
const DOT_STATE_TINT={working:'#fbbf24',searching:'#5eb8ff',solving:'#a78bfa',
  composing:'#f472b6',shaping:'#4ade80',idle:null,listening:'#64f0d2',thinking:'#a78bfa',searching:'#5eb8ff',
  processing:'#fbbf24',speaking:null,success:'#4ade80',error:'#f87171',
  sleeping:'#64748b',loading:'#94a3b8'};

function hexToRgb(h){
  h=h.replace('#','');
  if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];
}
function mixRgb(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}

function drawDotOrb(cv,size,time,state,cfg){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  if(cv.width!==size*dpr||cv.height!==size*dpr){
    cv.width=size*dpr;cv.height=size*dpr;
    cv.style.width=size+'px';cv.style.height=size+'px';
  }
  var g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,size,size);
  var R=size/2, cx=R, cy=R, t=time*cfg.speed;
  var base=hexToRgb(cfg.dotColor);
  var tintHex=cfg.useAccent?(DOT_STATE_TINT[state]||cfg.accent):null;
  var tint=tintHex?hexToRgb(tintHex):null;
  var light=cfg.theme==='light';
  g.globalCompositeOperation=light?'source-over':'lighter';

  if(cfg.structure!=='grid'){
    /* ---- lattice globe: latitude rings, tilted axis, orthographic ---- */
    var Rs=R*0.76;                                  /* sphere inset in the box */
    /* base sized so the *median painted* radius lands on the reference's
       1.34px at 64px (the depth and brightness multipliers below average ~0.7) */
    var dotPx=cfg.dotPx>0?cfg.dotPx
              :Math.max(0.34,2.3*radiusScale(size,cfg.rsPow)*cfg.dotScale);
    var rings=Math.max(3,Math.round(cfg.rings*Math.min(1,0.42+size/230)));
    var density=Math.max(3,Math.round(cfg.density*Math.min(1,0.42+size/230)));
    var pts=latticePoints(rings,density);
    var yaw=t*cfg.spin, tilt=cfg.tilt;
    var ct=Math.cos(tilt), st=Math.sin(tilt);
    var isLat=LATTICE_STATES.indexOf(state)>=0;

    if(state==='shaping'){                          /* outline morph, not a globe */
      var seg=(t*0.42)%3, phase=Math.floor(seg), fr=seg-phase;
      var ease=fr<0.55?(1-Math.pow(1-fr/0.55,3)):1;
      var sides=[0,3,4];                            /* circle, triangle, square */
      var nOut=Math.max(14,Math.round(density*2.2));
      for(var q=0;q<nOut;q++){
        var u=q/nOut;
        var pA=polyPoint(sides[phase],u), pB=polyPoint(sides[(phase+1)%3],u);
        var ox=pA[0]+(pB[0]-pA[0])*ease, oy=pA[1]+(pB[1]-pA[1])*ease;
        var rot=t*cfg.roll;
        var xr=ox*Math.cos(rot)-oy*Math.sin(rot), yr=ox*Math.sin(rot)+oy*Math.cos(rot);
        var va=0.55+0.45*Math.sin(u*6.2832*2-t*2.0);
        var aa=(cfg.minAlpha+va*0.9)*(1-cfg.flicker*0.35*(0.5+0.5*Math.sin(t*6.0+q*1.7)));
        paintDot(g,cx+xr*Rs,cy+yr*Rs,dotPx*(0.7+0.5*va),aa,va,base,tint,cfg,light);
      }
      g.shadowBlur=0;return;
    }

    for(var i=0;i<pts.length;i++){
      var p=pts[i], sd=p[3];
      var mod=isLat?latticeState(state,p,t,1):null;
      var lat=p[0]+(mod?mod.dlat:0), lon=p[1]+yaw+(mod?mod.dlon:0);
      var w=cfg.drift, sh=cfg.shimmer;
      lon+=Math.sin(t*0.9+sd*24.1)*0.06*w+Math.sin(t*37.7+sd*61.3)*0.010*sh;
      lat+=Math.cos(t*0.7+sd*17.7)*0.04*w+Math.cos(t*37.7+sd*44.9)*0.008*sh;
      var rr3=(mod?mod.rr:1);
      var cl=Math.cos(lat)*rr3, X0=cl*Math.cos(lon), Y0=Math.sin(lat)*rr3, Z0=cl*Math.sin(lon);
      /* tilt the pole toward the viewer so rings read as a globe */
      var Y1=Y0*ct-Z0*st, Z=Y0*st+Z0*ct;
      /* in-plane roll */
      var ro=t*cfg.roll, cr=Math.cos(ro), sr2=Math.sin(ro);
      var X=X0*cr-Y1*sr2, Y=X0*sr2+Y1*cr;
      var depth=(Z+1)/2;
      var v=mod?mod.v
              :dotField(state,X,Y,Math.sqrt(X*X+Y*Y),Math.atan2(Y,X),t,cfg.softness,false);
      var tw=1-cfg.flicker*0.4*(0.5+0.5*Math.sin(t*6.0+sd*39.1));
      var a=(cfg.minAlpha+v*0.95)*(0.34+0.66*depth)*tw;
      if(a<0.012)continue;
      paintDot(g,cx+X*Rs,cy+Y*Rs,dotPx*(0.6+0.4*depth)*(0.7+0.45*v),a,v,base,tint,cfg,light);
    }
    g.shadowBlur=0;
    return;
  }

  /* ---- grid mode (flat hex/square lattice) ---- */
  var maxN=Math.max(5,Math.floor(size/2.9));
  var gn=Math.max(3,Math.min(Math.round(cfg.cols),maxN));
  var step=(size*0.94)/gn;
  var rowStep=cfg.hex?step*0.866:step;
  var rows=Math.ceil(size/rowStep)+1;
  for(var row=0;row<rows;row++){
    var y=(row-(rows-1)/2)*rowStep;
    var off=(cfg.hex&&row%2)?step/2:0;
    for(var col=-Math.ceil(gn/2)-1;col<=Math.ceil(gn/2)+1;col++){
      var x=col*step+off;
      var dist=Math.sqrt(x*x+y*y)/R;
      if(dist>1.02)continue;
      var nx=x/R, ny=y/R;
      var gv=dotField(state,nx,ny,dist,Math.atan2(ny,nx),t,cfg.softness,true);
      var ga2=Math.max(cfg.minAlpha,gv);
      var jx=0,jy=0;
      if(cfg.jitter>0){
        var s=Math.sin(col*12.9898+row*78.233)*43758.5453; var rnd=s-Math.floor(s);
        jx=Math.sin(t*7+rnd*30)*cfg.jitter*step*0.22;
        jy=Math.cos(t*6.3+rnd*24)*cfg.jitter*step*0.22;
      }
      var grad=Math.max(0.35,step*0.5*cfg.dotScale*(0.55+0.65*gv)/cfg.gap);
      var gc=tint?mixRgb(base,tint,Math.min(1,gv*1.15)):base;
      var grgb=Math.round(gc[0])+','+Math.round(gc[1])+','+Math.round(gc[2]);
      if(cfg.glow>0&&gv>0.25&&!light){
        g.shadowBlur=grad*3.2*cfg.glow;
        g.shadowColor='rgba('+grgb+','+(ga2*0.85).toFixed(3)+')';
      }else g.shadowBlur=0;
      g.fillStyle='rgba('+grgb+','+ga2.toFixed(3)+')';
      g.beginPath();g.arc(cx+x+jx,cy+y+jy,grad,0,6.2832);g.fill();
    }
  }
  g.shadowBlur=0;
}

/* ---- dot mode driver ---- */
let mode='3d', dotTime=0, dotLast=performance.now();
const dotCanvases=()=>[[$('#dotmain'),Math.round(dparams.previewSize)],
  ...[...document.querySelectorAll('#dotsizes canvas')].map(c=>[c,+c.dataset.size]),
  ...[...document.querySelectorAll('#dotctx canvas')].map(c=>[c,+c.dataset.size])];

function dotLoop(now){
  requestAnimationFrame(dotLoop);
  if(mode!=='dots')return;
  const dt=Math.max(0,Math.min((now-dotLast)/1000,.05));dotLast=now;
  dotTime+=dt;
  dotCanvases().forEach(([cv,sz])=>{if(cv)drawDotOrb(cv,sz,dotTime,currentState,dparams);});
}
requestAnimationFrame(dotLoop);

function setDotSize(px){
  px=Math.max(14,Math.min(260,Math.round(px)));
  dparams.previewSize=px;
  const m=$('#dotmain');
  m.style.width=px+'px';m.style.height=px+'px';
  $('#sizerange').value=px;
  $('#sizeval').textContent=px+'px';
  document.querySelectorAll('.schip').forEach(b=>b.classList.toggle('active',+b.dataset.s===px));
  const inp=[...document.querySelectorAll('#right input[type=range]')]
    .find(i=>i.previousSibling&&/Preview size/.test(i.parentElement.textContent||''));
  if(inp)inp.value=px;
}
document.querySelectorAll('.schip').forEach(b=>b.onclick=()=>setDotSize(+b.dataset.s));
$('#sizerange').addEventListener('input',e=>setDotSize(+e.target.value));

function applyDotTheme(){
  const st=$('#dotstage');
  const light=dparams.theme==='light';
  st.classList.toggle('light',light);
  $('#view').style.background=light
    ? 'radial-gradient(1200px 700px at 50% 45%, #f7f8fa 0%, #e7eaef 75%)'
    : BGS[0][0];
}

function buildStateBar(m){
  const bar=$('#states');
  bar.querySelectorAll('.state').forEach(x=>x.remove());
  const list=m==='dots'
    ? ['working','searching','solving','listening','composing','shaping',
       'idle','thinking','processing','speaking','success','error','sleeping']
    : Object.keys(STATES);
  if(list.indexOf(currentState)<0)currentState=list[0];
  list.forEach(st=>{
    const b2=document.createElement('button');
    b2.className='state'+(st===currentState?' active':'');
    b2.textContent=st[0].toUpperCase()+st.slice(1);
    b2.onclick=()=>{currentState=st;
      bar.querySelectorAll('.state').forEach(x=>x.classList.remove('active'));
      b2.classList.add('active');};
    bar.appendChild(b2);
  });
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.msw').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  $('#dotstage').classList.toggle('on',m==='dots');
  canvas.style.display=m==='dots'?'none':'block';
  $('#preset-name .nm').textContent=m==='dots'?'Classic Dots':currentPreset.name;
  $('#preset-name .ct').textContent=m==='dots'?'Dot Orbs':currentPreset.cat;
  ['btn-nodes','btn-mic','btn-cam','btn-rec'].forEach(id=>{
    const el=$('#'+id); if(el)el.style.display=m==='dots'?'none':'';
  });
  if(m==='dots'){ $('#nodes-panel').classList.remove('open'); applyDotTheme();
    setDotSize(dparams.previewSize); }
  else { $('#view').style.background=BGS[bgIndex][0]; }
  buildStateBar(m);
  renderLibraryFor(m);
  renderInspectorFor(m);
}
document.querySelectorAll('.msw').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));

/* mode-aware inspector + library (3D versions untouched) */
function renderInspectorFor(m){
  if(m!=='dots')return renderInspector();
  rightEl.innerHTML='';
  DOT_SCHEMA.forEach(sec=>{
    const s=document.createElement('div');
    s.className='insp-sec open';
    const h=document.createElement('button');
    h.className='insp-head';h.innerHTML=`${sec.label}<span class="chev">▶</span>`;
    h.onclick=()=>s.classList.toggle('open');
    s.appendChild(h);
    const body=document.createElement('div');body.className='insp-body';
    sec.ctls.forEach(c=>{
      if(c.t==='range'){
        const d=document.createElement('div');d.className='ctl';
        d.innerHTML=`<div class="ctl-row"><span class="ctl-lbl">${c.l}</span><span class="ctl-val">${fmt(dparams[c.k])}</span></div>`;
        const r=document.createElement('input');
        r.type='range';r.min=c.min;r.max=c.max;r.step=c.step;r.value=dparams[c.k];
        r.addEventListener('input',()=>{dparams[c.k]=+r.value;
          d.querySelector('.ctl-val').textContent=fmt(dparams[c.k]);
          if(c.k==='previewSize')setDotSize(+r.value);});
        d.appendChild(r);body.appendChild(d);
      }else if(c.t==='color'){
        const d=document.createElement('div');d.className='color-ctl';
        d.innerHTML=`<span class="ctl-lbl">${c.l}</span>`;
        const i=document.createElement('input');i.type='color';i.value=dparams[c.k];
        i.addEventListener('input',()=>{dparams[c.k]=i.value;});
        d.appendChild(i);body.appendChild(d);
      }else if(c.t==='toggle'){
        const d=document.createElement('div');d.className='toggle-ctl';
        d.innerHTML=`<span class="ctl-lbl">${c.l}</span>`;
        const tg=document.createElement('button');
        tg.className='tog'+(dparams[c.k]?' on':'');
        tg.onclick=()=>{dparams[c.k]=!dparams[c.k];tg.classList.toggle('on');};
        d.appendChild(tg);body.appendChild(d);
      }else if(c.t==='select'){
        const d=document.createElement('div');d.className='color-ctl';
        d.innerHTML=`<span class="ctl-lbl">${c.l}</span>`;
        const s2=document.createElement('select');s2.className='sel';
        c.opts.forEach(([v,l])=>{const o=document.createElement('option');
          o.value=v;o.textContent=l;if(dparams[c.k]===v)o.selected=true;s2.appendChild(o);});
        s2.addEventListener('change',()=>{dparams[c.k]=s2.value;applyDotTheme();});
        d.appendChild(s2);body.appendChild(d);
      }
    });
    s.appendChild(body);rightEl.appendChild(s);
  });
}

function renderLibraryFor(m){
  if(m!=='dots')return renderLibrary($('#search').value);
  listEl.innerHTML='';
  const f=$('#search').value.trim().toLowerCase();
  DOT_LIBRARY.forEach(grp=>{
    const items=grp.items.filter(([n])=>!f||n.toLowerCase().includes(f));
    if(!items.length)return;
    const cat=document.createElement('div');cat.className='cat open';
    const head=document.createElement('button');
    head.className='cat-head';head.innerHTML=`${grp.cat}<span class="chev">▶</span>`;
    head.onclick=()=>cat.classList.toggle('open');
    cat.appendChild(head);
    const wrap=document.createElement('div');wrap.className='cat-items';
    items.forEach(([name,cfg])=>{
      const b=document.createElement('button');
      b.className='preset';
      b.innerHTML=`<span class="swatch" style="background:${cfg.useAccent?cfg.accent:cfg.dotColor};--sw:${(cfg.useAccent?cfg.accent:cfg.dotColor)}66"></span>${name}`;
      b.onclick=()=>{
        dparams={...cfg};
        $('#preset-name .nm').textContent=name;
        $('#preset-name .ct').textContent='Dot Orbs';
        applyDotTheme();renderInspectorFor('dots');
        listEl.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
      };
      wrap.appendChild(b);
    });
    cat.appendChild(wrap);listEl.appendChild(cat);
  });
}

/* keyboard shortcuts */
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){
    e.preventDefault(); e.shiftKey?redo():undo(); return;
  }
  if(e.target.tagName==='INPUT'||e.target.isContentEditable)return;
  if(e.key==='r')$('#btn-random').click();
  if(e.key==='e')$('#btn-export').click();
  if(e.key==='b')$('#btn-bg').click();
  if(e.key==='s')savePreset();
  if(e.key==='p')snapshotPNG();
  if(e.key==='m')toggleAudio();
  if(e.key==='l')shareLink();
  if(e.key==='v')toggleRecord();
  if(e.key==='n')openNodes();
  if(e.key==='d')setMode(mode==='dots'?'3d':'dots');
  if(e.key==='?')toast('R random · S save · P snapshot · V record · M mic · L link · N nodes · D dot mode · E export · B bg · 1-0 states · ⌘Z undo');
  if(e.key==='Escape')$('#modal').classList.remove('show');
  const n=parseInt(e.key);
  if(n>=1&&n<=9){const keys=Object.keys(STATES);
    if(keys[n-1])statesEl.children[n].click();}
  if(e.key==='0')statesEl.children[10]&&statesEl.children[10].click();
});

/* init */
renderLibrary();
if(!loadFromHash())applyPreset('Core','Glow Orb',LIBRARY[0].items[0][1]);
snapshot();updateHistBtns();
/* prime dot canvases so the mode switch is instant */
dotCanvases().forEach(([cv,sz])=>{if(cv)drawDotOrb(cv,sz,0,'working',dparams);});
</script>
